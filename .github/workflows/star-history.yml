name: Star History

on:
  schedule:
    # Daily. The chart gains one point per run, so a missed day is a gap rather
    # than a wrong number.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: star-history
  cancel-in-progress: false

jobs:
  render:
    name: snapshot and render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: read the current star count
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The stargazers *list* answers 403 to this token -- it needs a
          # personal credential, which is why every off-the-shelf star-history
          # service asks for one. The *count* on the repository object is still
          # readable here, so the chart is built from daily snapshots instead
          # and needs no secret at all.
          #
          # The trade is that this cannot backfill. For a repository that
          # already has stars that matters; for this one there is nothing to
          # backfill, and not holding a credential is worth more.
          stars=$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.stargazers_count')
          echo "STARS=${stars}" >> "$GITHUB_ENV"
          echo "current count: ${stars}"

      - name: load the published history
        run: |
          set -euo pipefail
          # Everything the renderer reads or writes lives outside the checkout,
          # on purpose. The publishing branch tracks files at these same paths,
          # and a branch switch refuses to overwrite untracked files in the
          # working tree -- which is exactly how the first two scheduled runs
          # failed. Keeping the working tree pristine removes the whole class of
          # failure, not just the three filenames that happened to trigger it.
          out="${RUNNER_TEMP}/star-history"
          mkdir -p "$out"
          if git fetch --depth=1 origin output:refs/remotes/origin/output 2>/dev/null \
             && git show origin/output:history.json > "$out/history.json" 2>/dev/null; then
            echo "resuming an existing series"
          else
            echo '[]' > "$out/history.json"
            echo "no output branch yet; starting a new series"
          fi

      - name: record today and draw
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/star-history"
          node .github/star-history/render.mjs "$out/history.json" "$out" --record "$STARS"

      - name: publish to the output branch
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/star-history"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Switch branches first, while the working tree is still untouched:
          # there is nothing to stash, so there is nothing for the checkout to
          # refuse. The renderer lives on main and is not needed here.
          if git show-ref --verify --quiet refs/remotes/origin/output; then
            git checkout -B output refs/remotes/origin/output
          else
            git checkout --orphan output
            git rm -rf . >/dev/null 2>&1 || true
          fi

          cp "$out/history.json" "$out"/star-history-*.svg .
          git add history.json star-history-light.svg star-history-dark.svg

          if git diff --cached --quiet; then
            echo "nothing changed today"
            exit 0
          fi

          git commit -m "chore: star history for $(date -u +%Y-%m-%d)"
          # Not a force push: the branch is append-only, so its history is worth
          # keeping and a divergence here means something is wrong.
          git push origin output
