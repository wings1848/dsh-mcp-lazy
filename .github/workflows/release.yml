name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # OIDC token, exchanged for a short-lived npm credential
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm test

      - name: the tag must match package.json
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi
          echo "publishing $pkg"

      # `npm publish` rather than `pnpm publish`: the npm CLI is the reference
      # implementation for OIDC trusted publishing, and pnpm's support for it has
      # been version-dependent. npm only packs and uploads here, so the pnpm
      # workspace is not a problem. `prepack` builds lib/ first.
      #
      # No NODE_AUTH_TOKEN. Authentication comes from the OIDC exchange, which
      # requires a trusted publisher to be configured for this package on
      # npmjs.com (repository wings1848/dsh-mcp-lazy, workflow release.yml).
      # See CONTRIBUTING.md.
      # A version already on the registry is a success, not a failure. The first
      # release has to be published by hand -- a trusted publisher can only be
      # configured for a package that already exists -- so the tag that
      # accompanies it would otherwise produce a red run whose only message is
      # "cannot publish over the previously published versions".
      #
      # The test is "attempt the publish and read the rejection", not "ask npm
      # first". npm's read endpoints are served from a cache that lags minutes
      # behind a publish, so a `npm view` guard answers "not published" for a
      # version that is published, and the publish that follows is refused with
      # a 403 that reads like an authentication problem. That is precisely the
      # shape a re-run after a partial failure would take.
      - name: publish, unless this version is already on npm
        env:
          NPM_CONFIG_PROVENANCE: 'true'
        run: |
          set -uo pipefail
          pkg=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")

          set +e
          output=$(npm publish --provenance --access public 2>&1)
          code=$?
          set -e

          if [ "$code" -eq 0 ]; then
            printf '%s\n' "$output"
            echo "::notice::published ${pkg}@${version}"
            exit 0
          fi
          printf '%s\n' "$output"

          # Two anchors, because the two come from different places. The code is
          # npm's own and is printed as `npm error code EPUBLISHCONFLICT`; the
          # sentence is the registry's wording and is what npm echoes above it.
          # Matching only the sentence would fail the day npm rephrases its
          # friendly summary -- measured on npm 12.0.2, that summary already
          # reads "Cannot publish over existing version", not this sentence.
          if printf '%s' "$output" | grep -qE 'EPUBLISHCONFLICT|previously published versions'; then
            echo "::notice::${pkg}@${version} is already on npm; nothing to do."
            exit 0
          fi
          echo "::error::publish failed with exit ${code}"
          exit "$code"

      - name: create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"

          # Prefer the changelog section over --generate-notes. Generated notes
          # compare against the previous tag, which yields a bare "Full Changelog"
          # link for a first release and a bare commit list for every one after
          # it. The changelog is written by hand and says why each change exists,
          # so it is the better release page whenever it has something to say.
          notes=$(awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          # Drop the link definitions Keep a Changelog keeps at the bottom, then
          # the blank line between the version heading and the first section —
          # otherwise the release page opens with a gap.
          ' CHANGELOG.md | sed '/^\[.*\]:/d' | sed '/./,$!d')

          if [ -n "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            printf '%s\n' "$notes" > /tmp/notes.md
            echo "using the CHANGELOG section for ${version} ($(wc -l < /tmp/notes.md) lines)"
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --verify-tag \
              --notes-file /tmp/notes.md
          else
            echo "::warning::no CHANGELOG section for ${version}; falling back to generated notes"
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --verify-tag \
              --generate-notes
          fi
