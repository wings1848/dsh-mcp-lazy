name: Secrets

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a credential that lands in history is found even if no one
    # pushes for a while.
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trufflehog:
    name: trufflehog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: a secret removed in a later commit is still leaked.
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@v3.97.5
        with:
          # `--only-verified` keeps the build meaningful: trufflehog actively
          # checks the credential against the provider, so an unverified regex
          # hit (a test fixture, an example token) does not fail the run.
          extra_args: --only-verified
